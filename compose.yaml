name: pyscraper

services:
  python:
    image: temeteke/pyscraper:latest
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SELENIUM_FIREFOX_URL=http://selenium-hub:4444/wd/hub
      - SELENIUM_CHROME_URL=http://selenium-hub:4444/wd/hub
      - PLAYWRIGHT_CHROMIUM_URL=ws://playwright-hub:4000/ws
      - PLAYWRIGHT_FIREFOX_URL=ws://playwright-hub:4000/ws
      - PLAYWRIGHT_WEBKIT_URL=ws://playwright-hub:4000/ws
      # Profile nodes supply their profile path in the node stereotype.
      # Pass node="chrome-profile" / node="firefox-profile" to route there.
    # No depends_on: the client resolves Hub URLs at session time, so a
    # startup gate adds no value (and couples startup to Hub health).

  selenium-hub:
    image: selenium/hub:4.52.0
    expose:
      - "4442"
      - "4443"
    # Liveness only: the Grid reports ready:false until nodes register, so
    # requiring ready:true here would deadlock node startup (nodes wait for
    # a healthy hub, hub waits for nodes). Nodes self-register with retries.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4444/status >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Named volumes are root-owned on first mount. Check the volume root's
  # ownership on each start and chown only when needed, before the profile
  # nodes start, so the Selenium user (uid 1200 / gid 1201) can write.
  # Uses the same image/tag as selenium-chrome; keep it in sync on bumps.
  profile-volumes-init:
    image: selenium/node-chrome:4.52.0
    user: root
    network_mode: none
    entrypoint: ["/bin/sh", "-c"]
    # $$ escapes Compose interpolation; the shell receives $(...).
    command:
      - |
        set -eu
        if [ "$$(stat -c '%u:%g' /tmp/chrome-profile)" != "1200:1201" ]; then
          chown -R 1200:1201 /tmp/chrome-profile
        fi
        if [ "$$(stat -c '%u:%g' /tmp/firefox-profile)" != "1200:1201" ]; then
          chown -R 1200:1201 /tmp/firefox-profile
        fi
    volumes:
      - chrome-profile:/tmp/chrome-profile
      - firefox-profile:/tmp/firefox-profile
    restart: "no"

  selenium-chrome:
    image: selenium/node-chrome:4.52.0
    shm_size: 2gb
    # Chrome requires additional syscalls for sandbox IPC. shm_size:2gb alone
    # is not sufficient -- without seccomp:unconfined the session fails with
    # "DevToolsActivePort file doesn't exist" (verified 2026-08-30). Keep
    # relaxation dev-only; production should use a scoped seccomp profile.
    security_opt:
      - seccomp:unconfined
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_GRID_URL=http://selenium-hub:4444
      - 'SE_NODE_STEREOTYPE={"browserName": "chrome", "platformName": "Linux", "pyscraper:node": "default"}'
      - SE_NODE_MAX_SESSIONS=4
      - SE_VNC_NO_PASSWORD=true
      # Desktop size (Xvfb) shown in noVNC (16:9 to match the default 16:9
      # console tiles). Restart to apply.
      - SE_SCREEN_WIDTH=1280
      - SE_SCREEN_HEIGHT=720
    expose:
      - "7900"
    # No depends_on: nodes retry event-bus registration, so they can start
    # in any order (and must not wait for a hub that waits for them).
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7900/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  # Persistent Chrome profile node. A profile is single-session.
  selenium-chrome-profile:
    image: selenium/node-chrome:4.52.0
    shm_size: 2gb
    security_opt:
      - seccomp:unconfined
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_GRID_URL=http://selenium-hub:4444
      - 'SE_NODE_STEREOTYPE={"browserName": "chrome", "platformName": "Linux", "pyscraper:node": "chrome-profile"}'
      - 'SE_NODE_STEREOTYPE_EXTRA={"goog:chromeOptions": {"binary": "/usr/bin/google-chrome", "args": ["--user-data-dir=/tmp/chrome-profile"]}}'
      - SE_NODE_MAX_SESSIONS=1
      - SE_VNC_NO_PASSWORD=true
      - SE_SCREEN_WIDTH=1280
      - SE_SCREEN_HEIGHT=720
    volumes:
      - chrome-profile:/tmp/chrome-profile
    depends_on:
      profile-volumes-init:
        condition: service_completed_successfully
    expose:
      - "7900"
    # No hub depends_on: nodes retry event-bus registration.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7900/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  selenium-firefox:
    image: selenium/node-firefox:4.52.0
    shm_size: 2gb
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_GRID_URL=http://selenium-hub:4444
      - 'SE_NODE_STEREOTYPE={"browserName": "firefox", "platformName": "Linux", "pyscraper:node": "default"}'
      - SE_NODE_MAX_SESSIONS=4
      - SE_VNC_NO_PASSWORD=true
      # Desktop size (Xvfb) shown in noVNC (16:9 to match the default 16:9
      # console tiles). Restart to apply.
      - SE_SCREEN_WIDTH=1280
      - SE_SCREEN_HEIGHT=720
    expose:
      - "7900"
    # No depends_on: same as selenium-chrome above.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7900/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  # Persistent Firefox profile node. A profile is single-session.
  selenium-firefox-profile:
    image: selenium/node-firefox:4.52.0
    shm_size: 2gb
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_GRID_URL=http://selenium-hub:4444
      - 'SE_NODE_STEREOTYPE={"browserName": "firefox", "platformName": "Linux", "pyscraper:node": "firefox-profile"}'
      - 'SE_NODE_STEREOTYPE_EXTRA={"moz:firefoxOptions": {"args": ["-profile", "/tmp/firefox-profile"]}}'
      - SE_NODE_MAX_SESSIONS=1
      - SE_VNC_NO_PASSWORD=true
      - SE_SCREEN_WIDTH=1280
      - SE_SCREEN_HEIGHT=720
    volumes:
      - firefox-profile:/tmp/firefox-profile
    depends_on:
      profile-volumes-init:
        condition: service_completed_successfully
    expose:
      - "7900"
    # No hub depends_on: nodes retry event-bus registration.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7900/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s

  playwright-hub:
    image: temeteke/pyscraper-playwright-hub:latest
    build:
      context: .
      dockerfile: Dockerfile.playwright-hub
    environment:
      # Drop node entries not re-registered within this TTL (seconds).
      # Must stay above the nodes' re-registration interval (default 10s).
      - PLAYWRIGHT_HUB_NODE_TTL=30
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4001/health', timeout=2).read()"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  playwright-chromium:
    image: temeteke/pyscraper-playwright-chromium:latest
    build:
      context: .
      dockerfile: Dockerfile.playwright-node
      args:
        PLAYWRIGHT_BROWSER: chromium
    shm_size: 2gb
    environment:
      - PLAYWRIGHT_BROWSER=chromium
      - PLAYWRIGHT_PORT=3000
      - PLAYWRIGHT_NODE_NAME=chromium
      - PLAYWRIGHT_ADVERTISE_HOST=playwright-chromium
      - PLAYWRIGHT_HUB_URL=http://playwright-hub:4001
      # Re-registration interval (seconds); must stay below the Hub TTL.
      - PLAYWRIGHT_HUB_REGISTER_INTERVAL=10
      # Desktop size (Xvfb) shown in noVNC (default 1280x720 to match the
      # default 16:9 console tiles); the browser window follows it via
      # explicit launch flags. Override to change, restart to apply:
      # - PLAYWRIGHT_SCREEN_WIDTH=1920
      # - PLAYWRIGHT_SCREEN_HEIGHT=1080
    expose:
      - "3000"
      - "7900"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7900/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    # No depends_on: nodes re-register with the Hub on an interval, so
    # they can start in any order and recover from a Hub restart without
    # a node restart; launch-server stays usable even if the Hub is down.

  playwright-firefox:
    image: temeteke/pyscraper-playwright-firefox:latest
    build:
      context: .
      dockerfile: Dockerfile.playwright-node
      args:
        PLAYWRIGHT_BROWSER: firefox
    shm_size: 2gb
    environment:
      - PLAYWRIGHT_BROWSER=firefox
      - PLAYWRIGHT_PORT=3000
      - PLAYWRIGHT_NODE_NAME=firefox
      - PLAYWRIGHT_ADVERTISE_HOST=playwright-firefox
      - PLAYWRIGHT_HUB_URL=http://playwright-hub:4001
      # Re-registration interval (seconds); must stay below the Hub TTL.
      - PLAYWRIGHT_HUB_REGISTER_INTERVAL=10
      # Desktop size (Xvfb) shown in noVNC (default 1280x720 to match the
      # default 16:9 console tiles; launch flags only size the startup
      # window, per-page windows follow the session viewport, see
      # operations.md). Override to change, restart to apply:
      # - PLAYWRIGHT_SCREEN_WIDTH=1920
      # - PLAYWRIGHT_SCREEN_HEIGHT=1080
    expose:
      - "3000"
      - "7900"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7900/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 90s
    # No depends_on: nodes re-register with the Hub on an interval, so
    # they can start in any order and recover from a Hub restart without
    # a node restart; launch-server stays usable even if the Hub is down.

  playwright-webkit:
    # WebKit has no official arm64 Linux support; the published image is
    # amd64-only. On arm64 hosts Docker must emulate linux/amd64; disable
    # this service if emulation is unavailable.
    platform: linux/amd64
    image: temeteke/pyscraper-playwright-webkit:latest
    build:
      context: .
      dockerfile: Dockerfile.playwright-node
      args:
        PLAYWRIGHT_BROWSER: webkit
    shm_size: 2gb
    environment:
      - PLAYWRIGHT_BROWSER=webkit
      - PLAYWRIGHT_PORT=3000
      - PLAYWRIGHT_NODE_NAME=webkit
      - PLAYWRIGHT_ADVERTISE_HOST=playwright-webkit
      - PLAYWRIGHT_HUB_URL=http://playwright-hub:4001
      # Re-registration interval (seconds); must stay below the Hub TTL.
      - PLAYWRIGHT_HUB_REGISTER_INTERVAL=10
      # Desktop size (Xvfb) shown in noVNC (default 1280x720 to match the
      # default 16:9 console tiles; the WebKit window follows the session
      # viewport, see operations.md). Override to change, restart to apply:
      # - PLAYWRIGHT_SCREEN_WIDTH=1920
      # - PLAYWRIGHT_SCREEN_HEIGHT=1080
    expose:
      - "3000"
      - "7900"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7900/ >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 120s
    # No depends_on: nodes re-register with the Hub on an interval, so
    # they can start in any order and recover from a Hub restart without
    # a node restart; launch-server stays usable even if the Hub is down.

  console:
    # Single entry point: noVNC reverse proxy + UI + session-manager relay
    # (/api/playwright/* (incl. states) to playwright-session-manager,
    # /api/selenium/* to selenium-session-manager).
    # Dedicated image (config + UI baked in, rendered at start from
    # /etc/resolv.conf); the same image runs on any Docker network.
    # Serve under a path prefix with CONSOLE_BASE_PATH=/console (default:
    # root; "/" then 308-redirects to the prefix).
    image: temeteke/pyscraper-console:latest
    build:
      context: .
      dockerfile: Dockerfile.console
    restart: unless-stopped
    # Startup order only (no health gate): the console resolves backends
    # via variable + resolver at request time and retries, so strict
    # health coupling would only delay startup without adding safety.
    depends_on:
      - playwright-chromium
      - playwright-firefox
      - playwright-webkit
      - selenium-chrome
      - selenium-chrome-profile
      - selenium-firefox
      - selenium-firefox-profile
      - playwright-session-manager
      - selenium-session-manager

  playwright-session-manager:
    # Playwright session open/close/save API for the console UI (published
    # as temeteke/pyscraper-playwright-session-manager; build for local dev
    # -- see Dockerfile.playwright-session-manager). FastAPI + uvicorn.
    image: temeteke/pyscraper-playwright-session-manager:latest
    build:
      context: .
      dockerfile: Dockerfile.playwright-session-manager
    environment:
      - PLAYWRIGHT_HUB_WS=ws://playwright-hub:4000/ws
      - SESSION_STATE_DIR=/data/sessions
      # Desktop size shared with the Playwright nodes' Xvfb (default
      # 1280x720): the manager computes the Firefox/WebKit default
      # viewports from it so viewport-less sessions fill the desktop.
      # Keep in sync with the nodes (same values); a mismatch leaves
      # browser windows smaller or larger than the VNC desktop:
      # - PLAYWRIGHT_SCREEN_WIDTH=1920
      # - PLAYWRIGHT_SCREEN_HEIGHT=1080
      # Browser startup can exceed the 60s open default on slow hosts
      # (webkit); raise if open timeouts appear in the manager logs.
      # When raising timeouts, keep the generated /api/ locations in sync
      # (console/generate.jq): proxy_read_timeout > 2 * OPEN_TIMEOUT + 10 and
      # > WORKER_TIMEOUT. The shipped default is 150s (OPEN 60 / WORKER
      # 120); e.g. OPEN 90 / WORKER 150 needs 220s.
      # - PLAYWRIGHT_OPEN_TIMEOUT=90
      # - PLAYWRIGHT_WORKER_TIMEOUT=150
    volumes:
      - session-states:/data/sessions
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; json.load(urllib.request.urlopen('http://localhost:8000/api/playwright/states', timeout=2))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

  selenium-session-manager:
    # Selenium session open/close API for the console UI (published as
    # temeteke/pyscraper-selenium-session-manager; build for local dev --
    # see Dockerfile.selenium-session-manager). FastAPI + uvicorn.
    image: temeteke/pyscraper-selenium-session-manager:latest
    build:
      context: .
      dockerfile: Dockerfile.selenium-session-manager
    environment:
      - SELENIUM_HUB_URL=http://selenium-hub:4444/wd/hub
      # Per-node browser launch options (JSON node -> options map; unset
      # keeps the legacy request). Applies only to the named node of the
      # matching browser; other nodes and the other browser are unaffected.
      # Chrome: {"<node>": {"args": [...], "excludeSwitches": [...]}}.
      # Firefox: {"<node>": {"args": [...], "prefs": {...}}}.
      # --user-data-dir (Chrome) and profile selectors -profile/-P/--profile
      # (incl. = forms, Firefox) are rejected: fixed profiles are owned by
      # the node volume and pyscraper:node routing (see docs/operations.md).
      # Browser proxy goes in args as --proxy-server=...; Grid control
      # traffic always bypasses proxy env. Restart to apply, e.g.:
      # - 'SELENIUM_NODE_CHROME_OPTIONS={"chrome-profile": {"args": ["--disable-blink-features=AutomationControlled", "--proxy-server=http://proxy.example:3128"], "excludeSwitches": ["enable-automation"]}}'
      # - 'SELENIUM_NODE_FIREFOX_OPTIONS={"firefox-profile": {"prefs": {"browser.startup.homepage": "about:blank"}}}'
      # Default-node language, e.g.:
      # - 'SELENIUM_NODE_CHROME_OPTIONS={"default": {"args": ["--lang=en-US"]}}'
      # Language, e.g.:
      # - 'SELENIUM_NODE_CHROME_OPTIONS={"chrome-profile": {"args": ["--lang=en-US"]}}'
      # - 'SELENIUM_NODE_FIREFOX_OPTIONS={"firefox-profile": {"prefs": {"intl.accept_languages": "en-US"}}}'
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,json; json.load(urllib.request.urlopen('http://localhost:8000/api/selenium/sessions', timeout=2))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s

volumes:
  # Persistent profile volumes. Docker creates named volumes root-owned on
  # first mount; profile-volumes-init checks the volume root ownership on
  # each start and chowns them to the Selenium user (uid 1200 / gid 1201)
  # only when needed. Nested root-owned files require a one-time manual
  # chown -R. If a host bind-mount is used instead, ensure the directory is
  # writable by that user (or remove the init service and its depends_on
  # entries and chown it yourself).
  chrome-profile:
  firefox-profile:
  # Console UI state files (storage_state JSON only), shared with
  # the host for inspection and reuse from pyscraper client code.
  session-states:
