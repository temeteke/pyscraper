[metadata]
name = pyscraper
author = temeteke
author_email = temeteke@gmail.com
classifiers =
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12

[options]
packages=find:
python_requires = >=3.10
use_scm_version = True
install_requires =
    # Security floor: covers CVE-2024-47081 and CVE-2026-25645 (the latter
    # only affects requests.utils.extract_zipped_paths used directly).
    requests>=2.33.1
    # Security floor: 2.8.0 is the first release with every published
    # urllib3 advisory fixed (proxy TLS handling, streaming decompression).
    # 1.26 is EOL and the tests cover the 2.x-only NameResolutionError. The
    # <3 cap matches requests' own urllib3 constraint.
    urllib3>=2.8.0,<3
    selenium
    lxml
    retry
    tqdm
    ffmpy
    m3u8
    fake-useragent
    # Pinned: must stay in sync with Dockerfile.playwright-node,
    # Dockerfile.playwright-session-manager, and Dockerfile.standalone
    # ARG PLAYWRIGHT_VERSION (client and node must speak the same
    # Playwright protocol version).
    playwright==1.64.1

[options.extras_require]
# Console stack (session managers + Hub + their tests): keep fastapi /
# uvicorn versions in sync with both session-manager Dockerfiles
# (ARG FASTAPI_VERSION / ARG UVICORN_VERSION). No pin test exists, so
# update all three together; .github/workflows/tests.yml installs
# .[console] and picks these pins up without its own literals.
# websockets is used by the Hub (and its tests); keep it in sync with
# Dockerfile.playwright-hub (legacy API, v14+ breaks the Hub).
# httpx is test-only (TestClient transport); Docker images ship only
# fastapi + uvicorn (uvicorn doubles as the local debug server), plus the
# opentelemetry-api that fastapi>=0.145 pulls in as a hard dependency.
console =
    fastapi==0.162.2
    uvicorn==0.54.0
    websockets>=12.0,<14.0
    httpx==0.28.1
