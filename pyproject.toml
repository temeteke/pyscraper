[build-system]
requires = ["setuptools", "setuptools-scm>=8.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "only-version"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
markers = [
    "integration: Integration tests that use real external dependencies (HTTP, FFmpeg, Browser)",
    "no_mock: Skip all automatic mocking for this test",
    "no_mock_http: Skip HTTP mocking only",
    "no_mock_ffmpeg: Skip FFmpeg mocking only",
]

# Run unit (mocked) tests by default; exclude integration tests
addopts = "-m 'not integration'"

filterwarnings = [
    # fastapi re-exports starlette's TestClient, which warns that the httpx
    # transport is deprecated in favour of httpx2. httpx2 requires Python
    # 3.11+, so the console extra keeps httpx while 3.10 stays supported.
    # Match on the message only: starlette <1.0 has no warning class to
    # reference. Re-check when dropping 3.10.
    "ignore:Using .*httpx.* is deprecated",
]
