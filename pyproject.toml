[build-system]
requires = ["setuptools", "setuptools-scm>=8.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "only-version"

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.pytest.ini_options]
markers = [
    "integration: Integration tests that use real external dependencies (HTTP, FFmpeg, Browser)",
    "no_mock: Skip all automatic mocking for this test",
    "no_mock_http: Skip HTTP mocking only",
    "no_mock_ffmpeg: Skip FFmpeg mocking only",
]

# Run unit (mocked) tests by default; exclude integration tests
addopts = "-m 'not integration'"

filterwarnings = [
    # Starlette's TestClient touches a deprecated anyio alias internally
    # (anyio>=4 + starlette<1.0); unrelated to our code. Re-check when
    # bumping fastapi/starlette.
    "ignore::DeprecationWarning:starlette.testclient",
]
