<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Console</title>
<style>
body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
header { display: flex; gap: 0.5em; padding: 0.5em 1em; align-items: center; border-bottom: 1px solid #ccc; flex-wrap: wrap; }
header h1 { font-size: 1em; margin: 0 1em 0 0; }
header input[type=text] { flex: 1 1 12em; min-width: 8em; }
iframe { flex: 1; border: 0; background: #000; }
.badge { font-size: 0.8em; padding: 0.1em 0.5em; border-radius: 1em; background: #eee; display: inline-block; min-width: 20ch; text-align: center; }
#badge { order: 99; margin-left: auto; }
.badge.open { background: #cfc; }
#toast { position: fixed; right: 1em; bottom: 1em; max-width: 28em;
  background: #fee; border: 1px solid #c66; border-radius: 4px;
  padding: 0.5em 0.75em; font-size: 0.85em; display: none; }
a { font-size: 0.85em; }
</style>
</head>
<body>
<header>
<h1 id="title">Browser</h1>
<span class="badge" id="badge">?</span>
<input type="text" id="url" placeholder="https://example.com">
<select id="state" title="State to load on open and save to" hidden></select>
<button id="save" hidden title="Save session state to the selected state">Save</button>
<button id="open">Open</button>
<button id="close">Close</button>
</header>
<iframe id="frame" src="about:blank" title="browser"></iframe>
<div id="toast" role="alert"></div>
<script>
"use strict";

// Static UI: the URL is <base>/view/<id>; derive both from the path so the
// same file works at "/view/<id>" or under CONSOLE_BASE_PATH.
function deriveBaseAndId() {
  const m = location.pathname.match(/^(.*)\/view\/([^/]+)\/?$/);
  return m ? {base: m[1], id: m[2]} : null;
}
const route = deriveBaseAndId();
const BASE = route ? route.base : "";
const ID = route ? route.id : null;
const REQUESTED_STATE = new URLSearchParams(location.search).get("state") || "";
const $ = id => document.getElementById(id);

function vncUrl(e) {
  return `${BASE}/vnc/${e.id}/?path=${BASE}/vnc/${e.id}/websockify&autoconnect=true`;
}

function matches(s, e) {
  return s && s.browser === e.browser && (s.node ?? null) === (e.node ?? null);
}

function formatDetail(data, status) {
  const detail = (data && typeof data === "object") ? data.detail : undefined;
  if (detail == null) return String(status);
  if (typeof detail === "string") return detail;
  return JSON.stringify(detail);
}

function showToast(msg) {
  const el = $("toast");
  el.textContent = msg.length > 300 ? msg.slice(0, 300) + "\u2026" : msg;
  el.title = msg.slice(0, 2000);
  el.style.display = "block";
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { el.style.display = "none"; }, 8000);
}

async function loadConfig() {
  const res = await fetch(`${BASE}/config.json`, {cache: "no-store"});
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  return (data && typeof data === "object") ? data : {};
}

function unknownBrowser(message) {
  const p = document.createElement("p");
  const a = document.createElement("a");
  a.href = `${BASE}/`;
  a.textContent = "Back to tiles";
  p.append(message ? `${message} ` : "Unknown browser. ", a);
  document.body.replaceChildren(p);
}

async function setup(e) {
  document.title = e.label;
  $("title").textContent = e.label;
  const apiBase = `${BASE}/api/${e.framework}/sessions`;
  const supportsState = !!e.storage_state && e.framework === "playwright";
  // Configured states: the only ids the UI may load from / save to. The
  // file form (<id>.json) is never shown; labels are display-only.
  const states = (supportsState && Array.isArray(e.storage_state.states))
    ? e.storage_state.states.filter(s => s && typeof s.id === "string")
    : [];
  const stateById = new Map(states.map(s => [s.id, s]));
  let sessionId = null;
  let sessionKnown = false;  // a successful session list has been seen
  let listUnknown = false;   // the latest session list fetch failed
  let opening = false;       // an Open request is in flight
  let closing = false;       // a Close request is in flight
  let saving = false;        // a Save request is in flight
  let savedFor = null;       // session id saved since it opened (null: none)
  let sessionStateId = "";   // state chosen when this page opened the session
  let ownedSessionId = null; // session opened by THIS page (Close/cleanup)
  let refreshSeq = 0;        // drops stale/out-of-order list responses
  let existingIds = null;    // state ids server-side; null = unknown

  $("frame").src = vncUrl(e);
  if (supportsState) {
    $("state").hidden = false;
    $("save").hidden = false;
    fillStateSelect();
  }
  // Start fail closed: until the first session list succeeds we must not
  // allow Open (an unseen session could already exist).
  applyUnknownSession();

  // Returns the existing state ids, or null when the list could not be
  // fetched (the caller keeps the last known list instead of assuming none).
  async function loadStateIds() {
    try {
      const res = await fetch(`${BASE}/api/playwright/states`, {cache: "no-store"});
      if (!res.ok) return null;
      const data = await res.json();
      return (data && Array.isArray(data.states))
        ? data.states.map(s => s && s.id).filter(x => typeof x === "string")
        : null;
    } catch (err) {
      return null;
    }
  }

  function fillStateSelect() {
    const sel = $("state");
    sel.replaceChildren();
    const none = document.createElement("option");
    none.value = "";
    none.textContent = "(no state)";
    sel.appendChild(none);
    for (const s of states) {
      const o = document.createElement("option");
      o.value = s.id;
      o.textContent = s.label || s.id;
      sel.appendChild(o);
    }
    // Default to the first state; an unknown ?state= id is ignored.
    const wanted = stateById.has(REQUESTED_STATE)
      ? REQUESTED_STATE
      : (states[0] ? states[0].id : "");
    sel.value = wanted;
  }

  // The selected state prefills the URL field (empty when it has no url).
  function prefillUrl() {
    const s = stateById.get($("state").value);
    $("url").value = (s && typeof s.url === "string") ? s.url : "";
  }

  function setStateLocked(locked) {
    if (supportsState) $("state").disabled = locked;
  }

  // Fail closed: while the session list is unknown, keep the last known
  // lock and block Open so a duplicate session cannot be created. Close
  // stays available for the session this page opened (ownedSessionId): that
  // handle came from our own Open response, not from a guess.
  function applyUnknownSession() {
    $("badge").textContent = "error (?)";
    $("badge").classList.remove("open");
    $("open").disabled = true;
    $("close").disabled = !ownedSessionId;
    $("save").disabled = true;
    setStateLocked(true);
  }

  // Reflect the known session (id or none) in the controls and the state
  // lock. Safe to call after a failed refresh: the last confirmed state is
  // preserved rather than being downgraded to "no session". When the latest
  // list fetch failed, Open stays disabled so a session created elsewhere
  // cannot be duplicated.
  function applySession() {
    const unknown = listUnknown;
    $("badge").textContent = sessionId
      ? (unknown ? `open (${sessionId}) ?` : `open (${sessionId})`)
      : (unknown ? "error (?)" : "closed");
    $("badge").classList.toggle("open", !!sessionId);
    $("open").disabled = opening || closing || saving || !!sessionId || unknown;
    $("close").disabled = closing || saving || !sessionId;
    const stateSelected = supportsState && !!$("state").value;
    $("save").disabled = saving || closing || !sessionId || !stateSelected;
    // The selected state is fixed for the lifetime of the session: lock the
    // selector from the moment Open is pressed until Close succeeds, so the
    // session's load source and save target stay the same id.
    setStateLocked(opening || closing || saving || !!sessionId);
  }

  async function refreshSession() {
    const seq = ++refreshSeq;
    let sessions;
    try {
      const res = await fetch(apiBase, {cache: "no-store"});
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      if (!(data && Array.isArray(data.sessions))) throw new Error("malformed session list");
      if (!data.sessions.every(s => s && typeof s.id === "string")) {
        throw new Error("malformed session entry");
      }
      sessions = data.sessions;
    } catch (err) {
      if (seq !== refreshSeq) return;  // a newer refresh already answered
      // Unknown state: only fail closed when no successful list has ever
      // been seen; otherwise keep the last confirmed session and lock, but
      // keep Open disabled (another client may have opened one meanwhile).
      listUnknown = true;
      if (sessionKnown) applySession();
      else applyUnknownSession();
      return;
    }
    if (seq !== refreshSeq) return;  // a newer refresh already answered
    const mine = sessions.filter(s => matches(s, e));
    if (mine.length > 1) {
      // Ambiguous: more than one session matches this target. Do not
      // guess which one to close or save; stay fail-closed until resolved.
      // The session this page opened is still ours, so keep its handle for
      // cleanup (applyUnknownSession leaves Close enabled for it).
      sessionId = null;
      sessionKnown = false;
      applyUnknownSession();
      $("badge").textContent = `multiple (${mine.length})`;
      return;
    }
    const last = mine.length ? mine[0] : null;
    const nextId = (last && typeof last.id === "string") ? last.id : null;
    if (nextId !== ownedSessionId) {
      // The view is no longer on the session it opened (it was closed, or
      // another client replaced it): drop the saved-for/state association so
      // a later Close cannot skip the unsaved confirmation.
      ownedSessionId = null;
      sessionStateId = "";
      savedFor = null;
    }
    sessionId = nextId;
    sessionKnown = true;
    listUnknown = false;
    applySession();
  }

  $("state").onchange = prefillUrl;

  $("open").onclick = async () => {
    // Single-flight: ignore clicks while a session exists or is in flight.
    if (opening || closing || saving || sessionId) return;
    // Capture the choice now: the selector is locked below, so this is the
    // state this session loads and the id Save writes back to.
    const chosenStateId = supportsState ? $("state").value : "";
    // The state list may be unknown (GET /states failed): open fresh and
    // say so rather than silently skipping the load.
    const stateUnknown = !!chosenStateId && existingIds === null;
    const payload = {browser: e.browser};
    if (e.node) payload.node = e.node;
    const url = $("url").value.trim();
    if (url) payload.url = url;
    if (e.context_options) payload.context_options = e.context_options;
    // Load only when the selected id is known to exist; a configured id that
    // has no file yet opens fresh and can be created by Save.
    if (chosenStateId && existingIds !== null && existingIds.includes(chosenStateId)) {
      payload.state_id = chosenStateId;
    }
    opening = true;
    // Invalidate any session list request that started before this Open, so
    // a stale "no session" answer cannot unlock the UI mid-flight.
    refreshSeq++;
    setStateLocked(true);
    $("open").disabled = true;
    try {
      const res = await fetch(apiBase, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)});
      const data = (await res.json().catch(() => ({}))) ?? {};
      if (!res.ok) {
        const detail = formatDetail(data, res.status);
        if (res.status >= 400 && res.status < 500) {
          // The server rejected the request: no session was created, so the
          // previous known state is still valid.
          applySession();
        } else {
          // 5xx: the session may or may not have been created.
          sessionKnown = false;
          applyUnknownSession();
        }
        showToast(`Open failed: ${detail}`);
        return;
      }
      if (typeof data.id !== "string" || !data.id) {
        // A 2xx without a usable id cannot be trusted: stay fail closed.
        sessionKnown = false;
        applyUnknownSession();
        showToast("Open failed: no session id in response");
        return;
      }
      // Trust the response and update the controls immediately; the
      // follow-up list call only reconciles with the server.
      sessionId = data.id;
      sessionKnown = true;
      listUnknown = false;
      ownedSessionId = data.id;
      sessionStateId = chosenStateId;
      savedFor = null;
      applySession();
      if (stateUnknown) {
        showToast(`Could not check saved state '${chosenStateId}'; opened fresh`);
      } else if (chosenStateId && !existingIds.includes(chosenStateId)) {
        showToast(`No saved state for '${chosenStateId}'; opened fresh`);
      }
    } catch (err) {
      // Network failure: the request may have reached the server.
      sessionKnown = false;
      applyUnknownSession();
      showToast(`Open failed: ${err.message}`);
    } finally {
      opening = false;
      await refreshSession();
    }
  };

  $("close").onclick = async () => {
    // The owned session stays closable even when the list is ambiguous or
    // unknown: the id came from our own Open response, not from a guess.
    const target = sessionId || ownedSessionId;
    if (closing || saving || !target) return;
    // Unsaved-session guard: only when this page opened the session with a
    // selected state, and that session was not saved since.
    if (supportsState && sessionStateId && savedFor !== target) {
      if (!confirm("State has not been saved. Close anyway?")) return;
    }
    closing = true;
    applySession();
    try {
      const res = await fetch(`${apiBase}/${target}`, {method: "DELETE"});
      const data = (await res.json().catch(() => ({}))) ?? {};
      if (!res.ok) throw new Error(formatDetail(data, res.status));
      // Close is confirmed: reflect it now, then reconcile with the server.
      sessionId = null;
      sessionKnown = true;
      ownedSessionId = null;
      sessionStateId = "";
      savedFor = null;
      applySession();
    } catch (err) {
      showToast(`Close failed: ${err.message}`);
    } finally {
      closing = false;
      await refreshSession();
    }
  };

  $("save").onclick = async () => {
    if (saving || closing || !sessionId) return;
    // Capture the target up front: a 10s refresh may switch sessionId while
    // the request is in flight, and the saved-for flag must not follow it.
    const targetSessionId = sessionId;
    const stateId = $("state").value;
    if (!stateId) { showToast("Save failed: select a state id"); return; }
    saving = true;
    applySession();
    try {
      const res = await fetch(`${BASE}/api/playwright/states/${encodeURIComponent(stateId)}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({session_id: targetSessionId}),
      });
      const data = (await res.json().catch(() => ({}))) ?? {};
      if (!res.ok) throw new Error(formatDetail(data, res.status));
      // The file may be new; refresh the existence set for later Opens.
      // A failed refresh keeps the last known list (never assume empty).
      const ids = await loadStateIds();
      if (ids !== null) existingIds = ids;
      if (sessionId === targetSessionId) savedFor = targetSessionId;
      showToast(`Saved ${stateId}`);
    } catch (err) {
      showToast(`Save failed: ${err.message}`);
    } finally {
      saving = false;
      applySession();
    }
  };

  if (supportsState) {
    existingIds = await loadStateIds();
    prefillUrl();
  }
  await refreshSession();
  setInterval(refreshSession, 10000);
}

async function main() {
  if (!route) { unknownBrowser(); return; }
  let config;
  try {
    config = await loadConfig();
  } catch (err) {
    unknownBrowser(`Could not load ${BASE}/config.json: ${err.message}.`);
    return;
  }
  const targets = Array.isArray(config.targets) ? config.targets : [];
  const e = targets.find(x => x.id === ID);
  if (!e) { unknownBrowser(); return; }
  await setup(e);
}

main();
</script>
</body>
</html>
