# gateway: single entry point for the browsers (noVNC reverse proxy),
# the gateway UI (static index + per-browser view), and the session
# manager APIs (see the three /api/ locations below).
# The `path` query on vnc.html (see index.html) tells noVNC to open its
# websocket under the same subpath so the upgrade request routes to the
# right node.
#
#   /                  -> static index (browser tiles)
#   /view.html         -> single-browser view (query ?browser=<target>)
#   /api/playwright/   -> playwright-session-manager:8081 (sessions + save)
#   /api/selenium/     -> selenium-session-manager:8082 (sessions)
#   /api/state-files   -> playwright-session-manager:8081 (state file list)
#   /playwright-chromium/ -> playwright-chromium:7900
#   /playwright-firefox/  -> playwright-firefox:7900
#   /playwright-webkit/   -> playwright-webkit:7900
#   /selenium-chrome/  -> selenium-chrome-node:7900
#   /selenium-firefox/ -> selenium-firefox-node:7900
#
# Subpath proxying notes:
# - proxy_pass with a variable does NOT strip the location prefix (unlike
#   a static proxy_pass with a trailing "/"), so each location uses an
#   explicit `rewrite ... break` to strip the subpath before proxying.
#   (Variables + resolver are still needed so nginx starts even when the
#   nodes are not up yet -- avoids "host not found" exit at boot.)
# - Some noVNC assets may be referenced by absolute paths ("/app/...").
#   sub_filter rewrites those to the subpath so the page loads behind the
#   gateway (sub_filter_types covers CSS/JS too, not just HTML). If a
#   future noVNC version breaks this rewriting, fall back to per-browser
#   ports (8081/8082/8083 with plain "/" proxying).

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files /index.html =404;
    }

    location = /view.html {
        try_files /view.html =404;
    }

    location = /api/state-files {
        # Exact match wins over the /api/playwright/ prefix below.
        # Trailing-slash variant below covers curl slip-ups.
        set $pw_sessions playwright-session-manager:8081;
        proxy_pass http://$pw_sessions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 150s: worker reply timeout (120s) plus headroom so nginx never
        # 504s while the session manager is still working. Must satisfy:
        # proxy_read_timeout > 2 * PLAYWRIGHT_OPEN_TIMEOUT + 10
        # (open wait) and > PLAYWRIGHT_WORKER_TIMEOUT (close/save wait).
        # Slow browser startup (webkit) and page.goto must not 504 while
        # the session is still being created server-side.
        proxy_read_timeout 150s;
    }

    location = /api/state-files/ {
        # Trailing-slash alias: normalize to the canonical path before
        # proxying (the session manager only serves the exact path).
        set $pw_sessions playwright-session-manager:8081;
        rewrite ^/api/state-files/$ /api/state-files break;
        proxy_pass http://$pw_sessions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 150s;
    }

    location /api/playwright/ {
        # No rewrite needed: variable proxy_pass without a URI part
        # forwards the original /api/... path unchanged.
        set $pw_sessions playwright-session-manager:8081;
        proxy_pass http://$pw_sessions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Same headroom rule as /api/state-files above (see there).
        proxy_read_timeout 150s;
    }

    location /api/selenium/ {
        set $se_sessions selenium-session-manager:8082;
        proxy_pass http://$se_sessions;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 150s: well above 3 * SELENIUM_REQUEST_TIMEOUT (open issues up
        # to 3 Grid calls -- create, navigate, compensating close --
        # ~90s worst case), so Grid-side timeouts never surface as nginx 504s.
        proxy_read_timeout 150s;
    }

    location /playwright-chromium/ {
        set $novnc_node playwright-chromium:7900;
        rewrite ^/playwright-chromium/(.*) /$1 break;
        proxy_pass http://$novnc_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
        sub_filter_once off;
        sub_filter_types text/css application/javascript;
        sub_filter 'src="/' 'src="/playwright-chromium/';
        sub_filter 'href="/' 'href="/playwright-chromium/';
        sub_filter 'url(/' 'url(/playwright-chromium/';
    }

    location /playwright-firefox/ {
        set $novnc_node playwright-firefox:7900;
        rewrite ^/playwright-firefox/(.*) /$1 break;
        proxy_pass http://$novnc_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
        sub_filter_once off;
        sub_filter_types text/css application/javascript;
        sub_filter 'src="/' 'src="/playwright-firefox/';
        sub_filter 'href="/' 'href="/playwright-firefox/';
        sub_filter 'url(/' 'url(/playwright-firefox/';
    }

    location /playwright-webkit/ {
        set $novnc_node playwright-webkit:7900;
        rewrite ^/playwright-webkit/(.*) /$1 break;
        proxy_pass http://$novnc_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
        sub_filter_once off;
        sub_filter_types text/css application/javascript;
        sub_filter 'src="/' 'src="/playwright-webkit/';
        sub_filter 'href="/' 'href="/playwright-webkit/';
        sub_filter 'url(/' 'url(/playwright-webkit/';
    }

    location /selenium-chrome/ {
        set $novnc_node selenium-chrome-node:7900;
        rewrite ^/selenium-chrome/(.*) /$1 break;
        proxy_pass http://$novnc_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
        sub_filter_once off;
        sub_filter_types text/css application/javascript;
        sub_filter 'src="/' 'src="/selenium-chrome/';
        sub_filter 'href="/' 'href="/selenium-chrome/';
        sub_filter 'url(/' 'url(/selenium-chrome/';
    }

    location /selenium-firefox/ {
        set $novnc_node selenium-firefox-node:7900;
        rewrite ^/selenium-firefox/(.*) /$1 break;
        proxy_pass http://$novnc_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
        sub_filter_once off;
        sub_filter_types text/css application/javascript;
        sub_filter 'src="/' 'src="/selenium-firefox/';
        sub_filter 'href="/' 'href="/selenium-firefox/';
        sub_filter 'url(/' 'url(/selenium-firefox/';
    }
}
