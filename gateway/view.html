<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PyScraper Gateway - Browser View</title>
<style>
body { font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
header { display: flex; gap: 0.5em; padding: 0.5em 1em; align-items: center; border-bottom: 1px solid #ccc; flex-wrap: wrap; }
header h1 { font-size: 1em; margin: 0 1em 0 0; }
header input[type=text] { flex: 1 1 12em; min-width: 8em; }
iframe { flex: 1; border: 0; background: #000; }
.badge { font-size: 0.8em; padding: 0.1em 0.5em; border-radius: 1em; background: #eee; display: inline-block; min-width: 20ch; text-align: center; }
#badge { order: 99; margin-left: auto; }
.badge.open { background: #cfc; }
#toast { position: fixed; right: 1em; bottom: 1em; max-width: 28em;
  background: #fee; border: 1px solid #c66; border-radius: 4px;
  padding: 0.5em 0.75em; font-size: 0.85em; display: none; }
a { font-size: 0.85em; }
</style>
</head>
<body>
<header>
<h1 id="title">Browser</h1>
<span class="badge" id="badge">?</span>
<input type="text" id="url" placeholder="https://example.com">
<select id="state" title="State to load on open and save to" hidden></select>
<button id="save" hidden title="Save session state to the selected state">Save</button>
<span id="savehint" hidden></span>
<button id="open">Open</button>
<button id="close">Close</button>
</header>
<iframe id="frame" src="about:blank" title="browser"></iframe>
<div id="toast" role="alert"></div>
<script>
"use strict";

// Static UI: the URL is <base>/view/<id>; derive both from the path so the
// same file works at "/view/<id>" or under GATEWAY_BASE_PATH.
function deriveBaseAndId() {
  const m = location.pathname.match(/^(.*)\/view\/([^/]+)\/?$/);
  return m ? {base: m[1], id: m[2]} : null;
}
const route = deriveBaseAndId();
const BASE = route ? route.base : "";
const ID = route ? route.id : null;
const $ = id => document.getElementById(id);

function vncUrl(e) {
  return `${BASE}/vnc/${e.id}/?path=${BASE}/vnc/${e.id}/websockify&autoconnect=true`;
}

function matches(s, e) {
  return s && s.browser === e.browser && (s.node ?? null) === (e.node ?? null);
}

function formatDetail(data, status) {
  const detail = (data && typeof data === "object") ? data.detail : undefined;
  if (detail == null) return String(status);
  if (typeof detail === "string") return detail;
  return JSON.stringify(detail);
}

function showToast(msg) {
  const el = $("toast");
  el.textContent = msg.length > 300 ? msg.slice(0, 300) + "\u2026" : msg;
  el.title = msg.slice(0, 2000);
  el.style.display = "block";
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => { el.style.display = "none"; }, 8000);
}

async function loadEndpoints() {
  const res = await fetch(`${BASE}/api/endpoints`, {cache: "no-store"});
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  return (data && Array.isArray(data.endpoints)) ? data.endpoints : [];
}

function unknownBrowser() {
  const p = document.createElement("p");
  const a = document.createElement("a");
  a.href = `${BASE}/`;
  a.textContent = "Back to tiles";
  p.append("Unknown browser. ", a);
  document.body.replaceChildren(p);
}

async function setup(e) {
  document.title = `PyScraper Gateway - ${e.label}`;
  $("title").textContent = e.label;
  const apiBase = `${BASE}/api/${e.framework}/sessions`;
  const supportsState = !!e.storage_state && e.storage_state.enabled === true
    && e.framework === "playwright";
  // Curated state ids from storage_state.ids: the only values the UI may
  // load from / save to. File names (and the .json extension) are never
  // shown; ids are opaque resource names.
  const configuredIds = (e.storage_state && Array.isArray(e.storage_state.ids))
    ? e.storage_state.ids : [];
  let sessionId = null;
  let sessionKnown = false;  // a successful session list has been seen
  let opening = false;       // an Open request is in flight
  let closing = false;       // a Close request is in flight
  let refreshSeq = 0;        // drops stale/out-of-order list responses
  let existingIds = [];      // state ids that exist server-side right now

  $("frame").src = vncUrl(e);
  if (supportsState) {
    $("state").hidden = false;
    $("save").hidden = false;
    if (!configuredIds.length) {
      $("save").disabled = true;
      $("savehint").hidden = false;
      $("savehint").textContent = "Set storage_state.ids to enable saving";
    }
  }
  // Start fail closed: until the first session list succeeds we must not
  // allow Open (an unseen session could already exist).
  applyUnknownSession();

  async function loadStateIds() {
    try {
      const res = await fetch(`${BASE}/api/playwright/states`, {cache: "no-store"});
      if (!res.ok) return [];
      const data = await res.json();
      return (data && Array.isArray(data.states))
        ? data.states.map(s => s && s.id).filter(x => typeof x === "string")
        : [];
    } catch (err) {
      return [];
    }
  }

  function fillSelect(sel, options, noneLabel) {
    const current = sel.value;
    sel.replaceChildren();
    if (noneLabel !== undefined) {
      const none = document.createElement("option");
      none.value = "";
      none.textContent = noneLabel;
      sel.appendChild(none);
    }
    for (const value of options) {
      const o = document.createElement("option");
      o.value = value;
      o.textContent = value;
      sel.appendChild(o);
    }
    if ([...sel.options].some(o => o.value === current)) sel.value = current;
  }

  async function refreshStateOptions() {
    existingIds = await loadStateIds();
    // One selector serves both directions: every curated id is offered so a
    // new one can be created by saving to it. Existence only matters at Open
    // (a missing id opens fresh instead of loading).
    fillSelect($("state"), configuredIds, "(no state)");
  }

  function setStateLocked(locked) {
    if (supportsState) $("state").disabled = locked;
  }

  // Fail closed: while the session list is unknown, keep the last known
  // lock and block Open so a duplicate session cannot be created.
  function applyUnknownSession() {
    $("badge").textContent = "error (?)";
    $("badge").classList.remove("open");
    $("open").disabled = true;
    $("close").disabled = true;
    $("save").disabled = true;
    setStateLocked(true);
  }

  // Reflect the known session (id or none) in the controls and the Load
  // lock. Safe to call after a failed refresh: the last confirmed state is
  // preserved rather than being downgraded to "no session".
  function applySession() {
    $("badge").textContent = sessionId ? `open (${sessionId})` : "closed";
    $("badge").classList.toggle("open", !!sessionId);
    $("open").disabled = opening || closing || !!sessionId;
    $("close").disabled = closing || !sessionId;
    $("save").disabled = closing || !sessionId || !configuredIds.length;
    // The selected state is fixed for the lifetime of the session: lock the
    // selector from the moment Open is pressed until Close succeeds, so the
    // session's load source and save target stay the same id.
    setStateLocked(opening || closing || !!sessionId);
  }

  async function refreshSession() {
    const seq = ++refreshSeq;
    let sessions;
    try {
      const res = await fetch(apiBase, {cache: "no-store"});
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      sessions = (data && Array.isArray(data.sessions)) ? data.sessions : [];
    } catch (err) {
      if (seq !== refreshSeq) return;  // a newer refresh already answered
      // Unknown state: only fail closed when no successful list has ever
      // been seen; otherwise keep the last confirmed session and lock.
      if (sessionKnown) applySession();
      else applyUnknownSession();
      return;
    }
    if (seq !== refreshSeq) return;  // a newer refresh already answered
    const mine = sessions.filter(s => matches(s, e));
    if (mine.length > 1) {
      // Ambiguous: more than one session matches this endpoint. Do not
      // guess which one to close or save; stay fail-closed until resolved.
      sessionId = null;
      sessionKnown = false;
      applyUnknownSession();
      $("badge").textContent = `multiple (${mine.length})`;
      return;
    }
    const last = mine.length ? mine[0] : null;
    sessionId = (last && typeof last.id === "string") ? last.id : null;
    sessionKnown = true;
    applySession();
  }

  $("open").onclick = async () => {
    // Single-flight: ignore clicks while a session exists or is opening.
    if (opening || sessionId) return;
    // Capture the choice now: the selector is locked below, so this is the
    // state this session loads and the id Save writes back to.
    const chosenStateId = supportsState ? $("state").value : "";
    const payload = {browser: e.browser};
    if (e.node) payload.node = e.node;
    const url = $("url").value.trim();
    if (url) payload.url = url;
    // Load only when the selected id actually exists; a curated id that has
    // no file yet opens fresh and can be created by Save.
    if (chosenStateId && existingIds.includes(chosenStateId)) {
      payload.state_id = chosenStateId;
    }
    opening = true;
    // Invalidate any session list request that started before this Open, so
    // a stale "no session" answer cannot unlock the UI mid-flight.
    refreshSeq++;
    setStateLocked(true);
    $("open").disabled = true;
    try {
      const res = await fetch(apiBase, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(payload)});
      const data = (await res.json().catch(() => ({}))) ?? {};
      if (!res.ok) {
        const detail = formatDetail(data, res.status);
        if (res.status >= 400 && res.status < 500) {
          // The server rejected the request: no session was created, so the
          // previous known state is still valid.
          applySession();
        } else {
          // 5xx: the session may or may not have been created.
          sessionKnown = false;
          applyUnknownSession();
        }
        showToast(`Open failed: ${detail}`);
        return;
      }
      if (typeof data.id !== "string" || !data.id) {
        // A 2xx without a usable id cannot be trusted: stay fail closed.
        sessionKnown = false;
        applyUnknownSession();
        showToast("Open failed: no session id in response");
        return;
      }
      // Trust the response and update the controls immediately; the
      // follow-up list call only reconciles with the server.
      sessionId = data.id;
      sessionKnown = true;
      applySession();
      if (chosenStateId && !existingIds.includes(chosenStateId)) {
        showToast(`No saved state for '${chosenStateId}'; opened fresh`);
      }
    } catch (err) {
      // Network failure: the request may have reached the server.
      sessionKnown = false;
      applyUnknownSession();
      showToast(`Open failed: ${err.message}`);
    } finally {
      opening = false;
      await refreshSession();
    }
  };

  $("close").onclick = async () => {
    if (closing || !sessionId) return;
    // Capture the id: a concurrent Open/refresh must not change which
    // session this request closes.
    const targetSessionId = sessionId;
    closing = true;
    applySession();
    try {
      const res = await fetch(`${apiBase}/${targetSessionId}`, {method: "DELETE"});
      const data = (await res.json().catch(() => ({}))) ?? {};
      if (!res.ok) throw new Error(formatDetail(data, res.status));
      // Close is confirmed: reflect it now, then reconcile with the server.
      sessionId = null;
      sessionKnown = true;
      applySession();
    } catch (err) {
      showToast(`Close failed: ${err.message}`);
    } finally {
      closing = false;
      await refreshSession();
    }
  };

  $("save").onclick = async () => {
    if (closing || !sessionId) return;
    const stateId = $("state").value;
    if (!stateId) { showToast("Save failed: select a state id"); return; }
    try {
      const res = await fetch(`${BASE}/api/playwright/states/${encodeURIComponent(stateId)}`, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({session_id: sessionId}),
      });
      const data = (await res.json().catch(() => ({}))) ?? {};
      if (!res.ok) throw new Error(formatDetail(data, res.status));
      // The file may be new; refresh the existence set for later Opens.
      await refreshStateOptions();
      showToast(`Saved ${stateId}`);
    } catch (err) {
      showToast(`Save failed: ${err.message}`);
    }
  };

  if (supportsState) await refreshStateOptions();
  await refreshSession();
  setInterval(refreshSession, 10000);
}

async function main() {
  if (!route) { unknownBrowser(); return; }
  let endpoints;
  try {
    endpoints = await loadEndpoints();
  } catch (err) {
    unknownBrowser();
    return;
  }
  const e = endpoints.find(x => x.id === ID);
  if (!e) { unknownBrowser(); return; }
  await setup(e);
}

main();
</script>
</body>
</html>
