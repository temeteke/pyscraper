{{- if .Values.console.enabled }}
{{- $ingress := default (dict) .Values.console.ingress }}
{{- $clusterDomain := default "cluster.local" .Values.global.clusterDomain }}
{{- $upstreamSuffix := default (printf ".%s.svc.%s" .Release.Namespace $clusterDomain) .Values.console.upstreamSuffix }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: console
  labels:
    app: console
data:
  config.yaml: |
    {{- include "pyscraper.consoleConfig" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  labels:
    app: console
spec:
  replicas: {{ .Values.console.replicas }}
  selector:
    matchLabels:
      app: console
  template:
    metadata:
      labels:
        app: console
      annotations:
        checksum/config: {{ include "pyscraper.consoleConfig" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.console.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: console
          image: {{ include "pyscraper.image" (dict "root" . "image" .Values.images.console) }}
          {{- with .Values.console.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            {{- if .Values.global.timezone }}
            {{- include "pyscraper.timezoneEnv" . | nindent 12 }}
            {{- end }}
            {{- with .Values.console.basePath }}
            - name: CONSOLE_BASE_PATH
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.console.resolver }}
            - name: CONSOLE_RESOLVER
              value: {{ . | quote }}
            {{- end }}
            - name: CONSOLE_UPSTREAM_SUFFIX
              value: {{ $upstreamSuffix | quote }}
            - name: CONSOLE_SESSION_PORT
              value: "80"
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: config
              mountPath: /etc/console/config.yaml
              subPath: config.yaml
          {{- with .Values.console.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: config
          configMap:
            name: console
---
apiVersion: v1
kind: Service
metadata:
  name: console
  labels:
    app: console
spec:
  selector:
    app: console
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if $ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console
  labels:
    app: console
  {{- with $ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with $ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  rules:
    - http:
        paths:
          - path: {{ $ingress.path | quote }}
            pathType: {{ default "Prefix" $ingress.pathType | quote }}
            backend:
              service:
                name: console
                port:
                  name: http
      {{- with $ingress.host }}
      host: {{ . | quote }}
      {{- end }}
  {{- with $ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
