version: 2
updates:
  # Workflow actions are pinned to full commit SHAs (supply-chain
  # hardening). Dependabot understands SHA pins and updates both the SHA
  # and the `# vX.Y.Z` comment, keeping the pins fresh.
  # Minor/patch bumps are grouped into one PR; breaking major bumps get
  # their own PR so they are reviewed individually.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
