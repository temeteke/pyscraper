name: Publish Docker image

on:
  push:
    # Tag convention is vX.Y.Z (e.g. v1.2.1); narrower than 'v*' so that
    # accidental tags like `vfoo` do not trigger a failing workflow run.
    # NOTE: GitHub glob cannot express full semver, so short forms like
    # `v1.2` still trigger and then fail the X.Y.Z check below. Always cut
    # tags as `vX.Y.Z`.
    tags:
      - 'v[0-9]*'
  schedule:
    - cron: '55 13 * * tue'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build and publish (e.g. 1.2.1). Empty = pushed tag, or latest release tag otherwise.'
        required: false
        default: ''

concurrency:
  group: docker-publish
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub and GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: version
        # NOTE: inputs.version must NOT be interpolated inside the run script
        # (command injection risk via quotes); pass it via env instead.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            TAG="$(printf '%s' "$INPUT_VERSION" | sed 's/^v//')"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            # Prefer the pushed tag itself over the latest tag, so that
            # back-pushing an old tag does not build a newer version.
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.0')"
            TAG="${TAG#v}"
          fi
          # bash regex validates the whole value (unlike grep, which matches
          # per line and lets embedded newlines through to GITHUB_OUTPUT).
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version. Expected X.Y.Z (e.g. 1.2.1)."
            exit 1
          fi
          MAJOR_MINOR="$(echo "$TAG" | grep -oE '^[0-9]+\.[0-9]+')"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "major_minor=$MAJOR_MINOR" >> $GITHUB_OUTPUT

      - name: Compute date
        id: date
        run: |
          echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "rfc3339=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            temeteke/pyscraper:latest
            temeteke/pyscraper:${{ steps.version.outputs.tag }}
            temeteke/pyscraper:${{ steps.version.outputs.tag }}-${{ steps.date.outputs.date }}
            temeteke/pyscraper:${{ steps.version.outputs.major_minor }}
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}-${{ steps.date.outputs.date }}
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.major_minor }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.created=${{ steps.date.outputs.rfc3339 }}
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}

      - name: Build and push Docker image standalone
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.standalone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            temeteke/pyscraper-standalone:latest
            temeteke/pyscraper-standalone:${{ steps.version.outputs.tag }}
            temeteke/pyscraper-standalone:${{ steps.version.outputs.tag }}-${{ steps.date.outputs.date }}
            temeteke/pyscraper-standalone:${{ steps.version.outputs.major_minor }}
            ghcr.io/${{ github.repository }}-standalone:latest
            ghcr.io/${{ github.repository }}-standalone:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}-standalone:${{ steps.version.outputs.tag }}-${{ steps.date.outputs.date }}
            ghcr.io/${{ github.repository }}-standalone:${{ steps.version.outputs.major_minor }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.created=${{ steps.date.outputs.rfc3339 }}
          build-args: |
            VERSION=${{ steps.version.outputs.tag }}

  push_playwright_images:
    name: Push Playwright images to Docker Hub and GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # actions/cache (type=gha) needs write for cache save; scoped to this
    # job so the top-level permissions stay minimal.
    permissions:
      contents: read
      packages: write
      actions: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - dockerfile: ./Dockerfile.playwright-node
            image: temeteke/pyscraper-playwright-chromium
            suffix: playwright-chromium
            platforms: linux/amd64,linux/arm64
            build_args: PLAYWRIGHT_BROWSER=chromium
          - dockerfile: ./Dockerfile.playwright-node
            image: temeteke/pyscraper-playwright-firefox
            suffix: playwright-firefox
            platforms: linux/amd64,linux/arm64
            build_args: PLAYWRIGHT_BROWSER=firefox
          # WebKit has no official arm64 Linux support; amd64-only to avoid
          # QEMU build failures and long emulation builds.
          - dockerfile: ./Dockerfile.playwright-node
            image: temeteke/pyscraper-playwright-webkit
            suffix: playwright-webkit
            platforms: linux/amd64
            build_args: PLAYWRIGHT_BROWSER=webkit
          - dockerfile: ./Dockerfile.playwright-hub
            image: temeteke/pyscraper-playwright-hub
            suffix: playwright-hub
            platforms: linux/amd64,linux/arm64
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up QEMU
        if: matrix.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version
        id: version
        # NOTE: inputs.version must NOT be interpolated inside the run script
        # (command injection risk via quotes); pass it via env instead.
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            TAG="$(printf '%s' "$INPUT_VERSION" | sed 's/^v//')"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            # Prefer the pushed tag itself over the latest tag, so that
            # back-pushing an old tag does not build a newer version.
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo 'v0.0')"
            TAG="${TAG#v}"
          fi
          # bash regex validates the whole value (unlike grep, which matches
          # per line and lets embedded newlines through to GITHUB_OUTPUT).
          if ! [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version. Expected X.Y.Z (e.g. 1.2.1)."
            exit 1
          fi
          MAJOR_MINOR="$(echo "$TAG" | grep -oE '^[0-9]+\.[0-9]+')"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "major_minor=$MAJOR_MINOR" >> $GITHUB_OUTPUT

      - name: Compute date
        id: date
        run: |
          echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT
          echo "rfc3339=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build and push Playwright image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=min
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ matrix.image }}:latest
            ${{ matrix.image }}:${{ steps.version.outputs.tag }}
            ${{ matrix.image }}:${{ steps.version.outputs.tag }}-${{ steps.date.outputs.date }}
            ${{ matrix.image }}:${{ steps.version.outputs.major_minor }}
            ghcr.io/${{ github.repository }}-${{ matrix.suffix }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.suffix }}:${{ steps.version.outputs.tag }}
            ghcr.io/${{ github.repository }}-${{ matrix.suffix }}:${{ steps.version.outputs.tag }}-${{ steps.date.outputs.date }}
            ghcr.io/${{ github.repository }}-${{ matrix.suffix }}:${{ steps.version.outputs.major_minor }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
            org.opencontainers.image.created=${{ steps.date.outputs.rfc3339 }}
