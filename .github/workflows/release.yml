name: Publish release

on:
  push:
    # Tag convention is vX.Y.Z (e.g. v1.2.1); narrower than 'v*' so that
    # accidental tags like `vfoo` do not trigger a failing workflow run.
    # NOTE: GitHub glob cannot express full semver, so short forms like
    # `v1.2` still trigger and then fail the version check in
    # `.github/actions/resolve-release`. Always cut tags as `vX.Y.Z`.
    tags:
      - 'v[0-9]*'

# GitHub keeps one pending run per concurrency group and cancels the older
# pending one, so a shared group would silently drop a release when several
# tags are pushed in a row. Channel moves are serialized separately in
# `move_channels`, which re-resolves the tags, so builds for different refs
# are safe to run in parallel.
concurrency:
  group: release-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  validate_release:
    name: Validate release chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release
        id: version
        uses: ./.github/actions/resolve-release

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2

      - name: Install yq
        run: |
          YQ_VERSION=v4.53.3
          YQ_SHA256=fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4
          curl -fsSL \
            --retry 5 --retry-delay 2 --retry-max-time 60 \
            --retry-all-errors --connect-timeout 10 \
            -o "$RUNNER_TEMP/yq" \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          echo "${YQ_SHA256}  $RUNNER_TEMP/yq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/yq" --version

      - name: Validate chart package
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! grep -q "^## \[${VERSION}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no [${VERSION}] section"
            exit 1
          fi
          helm lint charts/pyscraper
          rm -rf /tmp/validated
          mkdir -p /tmp/validated
          helm package charts/pyscraper -d /tmp/validated \
            --version "$VERSION" --app-version "$VERSION"
          helm show chart "/tmp/validated/pyscraper-${VERSION}.tgz" | tee /tmp/validated/chart.txt
          grep -Fqx "version: ${VERSION}" /tmp/validated/chart.txt
          grep -Fqx "appVersion: ${VERSION}" /tmp/validated/chart.txt
          pyscraper_images="console playwright.hub playwright.chromium playwright.firefox playwright.webkit playwright.sessionManager selenium.sessionManager"
          selenium_images="selenium.hub selenium.chrome selenium.firefox"
          for key in $pyscraper_images $selenium_images; do
            repository="$(yq -r ".images.${key}.repository" charts/pyscraper/values.yaml)"
            if [ -z "$repository" ] || [ "$repository" = "null" ]; then
              echo "::error::images.${key}.repository must be set"
              exit 1
            fi
          done
          for key in $selenium_images; do
            tag="$(yq -r ".images.${key}.tag" charts/pyscraper/values.yaml)"
            if [ -z "$tag" ] || [ "$tag" = "null" ]; then
              echo "::error::images.${key}.tag must be set"
              exit 1
            fi
          done
          image_ref() {
            key="$1"
            tag="$2"
            registry="$(yq -r ".images.${key}.registry" charts/pyscraper/values.yaml)"
            repository="$(yq -r ".images.${key}.repository" charts/pyscraper/values.yaml)"
            if [ -z "$registry" ] || [ "$registry" = "null" ]; then
              printf '%s:%s\n' "$repository" "$tag"
            else
              printf '%s/%s:%s\n' "$registry" "$repository" "$tag"
            fi
          }
          check_image() {
            ref="$(image_ref "$1" "$2")"
            if ! grep -Fq "image: ${ref}" /tmp/validated/images.yaml; then
              echo "::error::rendered chart is missing ${ref}"
              exit 1
            fi
          }
          helm template pyscraper "/tmp/validated/pyscraper-${VERSION}.tgz" -n pyscraper > /tmp/validated/rendered.yaml
          console_enabled="$(yq -r '.console.enabled' charts/pyscraper/values.yaml)"
          if [ "$console_enabled" = "true" ]; then
            sh scripts/check-console-config.sh /tmp/validated/rendered.yaml
          fi
          image_args=()
          while IFS= read -r node; do
            image_args+=(--set "nodes.${node}.enabled=true")
          done < <(yq -r '.nodes | keys[]' charts/pyscraper/values.yaml)
          image_args+=(
            --set selenium.hub.enabled=true
            --set playwright.hub.enabled=true
            --set selenium.sessionManager.enabled=true
            --set playwright.sessionManager.enabled=true
          )
          helm template pyscraper "/tmp/validated/pyscraper-${VERSION}.tgz" -n pyscraper \
            "${image_args[@]}" > /tmp/validated/images.yaml
          for key in $pyscraper_images; do
            if [ "$key" = "console" ] && [ "$console_enabled" != "true" ]; then
              continue
            fi
            check_image "$key" "$VERSION"
          done
          for key in $selenium_images; do
            check_image "$key" "$(yq -r ".images.${key}.tag" charts/pyscraper/values.yaml)"
          done

  push_to_registry:
    name: Push Docker image to Docker Hub and GHCR
    needs: validate_release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release
        id: version
        uses: ./.github/actions/resolve-release

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose tags
        id: tags
        uses: ./.github/actions/image-tags
        with:
          image: temeteke/pyscraper
          ghcr_image: ghcr.io/${{ github.repository }}
          version: ${{ steps.version.outputs.version }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.created }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      - name: Compose tags (standalone)
        id: tags_standalone
        uses: ./.github/actions/image-tags
        with:
          image: temeteke/pyscraper-standalone
          ghcr_image: ghcr.io/${{ github.repository }}-standalone
          version: ${{ steps.version.outputs.version }}

      - name: Build and push Docker image standalone
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile.standalone
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags_standalone.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.created }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

  push_playwright_images:
    name: Push browser and console images to Docker Hub and GHCR
    needs: validate_release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # actions/cache (type=gha) needs write for cache save; scoped to this
    # job so the top-level permissions stay minimal.
    permissions:
      contents: read
      packages: write
      actions: write
    strategy:
      fail-fast: false
      # Keep the image set in sync with the suffixes list in `move_channels`:
      # an image that is missing there never gets its latest / X.Y alias.
      matrix:
        include:
          - dockerfile: ./Dockerfile.playwright-node
            image: temeteke/pyscraper-playwright-chromium
            suffix: playwright-chromium
            platforms: linux/amd64,linux/arm64
            build_args: PLAYWRIGHT_BROWSER=chromium
          - dockerfile: ./Dockerfile.playwright-node
            image: temeteke/pyscraper-playwright-firefox
            suffix: playwright-firefox
            platforms: linux/amd64,linux/arm64
            build_args: PLAYWRIGHT_BROWSER=firefox
          # WebKit has no official arm64 Linux support; amd64-only to avoid
          # QEMU build failures and long emulation builds.
          - dockerfile: ./Dockerfile.playwright-node
            image: temeteke/pyscraper-playwright-webkit
            suffix: playwright-webkit
            platforms: linux/amd64
            build_args: PLAYWRIGHT_BROWSER=webkit
          - dockerfile: ./Dockerfile.playwright-hub
            image: temeteke/pyscraper-playwright-hub
            suffix: playwright-hub
            platforms: linux/amd64,linux/arm64
          - dockerfile: ./Dockerfile.playwright-session-manager
            image: temeteke/pyscraper-playwright-session-manager
            suffix: playwright-session-manager
            platforms: linux/amd64,linux/arm64
          - dockerfile: ./Dockerfile.selenium-session-manager
            image: temeteke/pyscraper-selenium-session-manager
            suffix: selenium-session-manager
            platforms: linux/amd64,linux/arm64
          - dockerfile: ./Dockerfile.console
            image: temeteke/pyscraper-console
            suffix: console
            platforms: linux/amd64,linux/arm64
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release
        id: version
        uses: ./.github/actions/resolve-release

      - name: Set up QEMU
        if: matrix.platforms != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compose tags
        id: tags
        uses: ./.github/actions/image-tags
        with:
          image: ${{ matrix.image }}
          ghcr_image: ghcr.io/${{ github.repository }}-${{ matrix.suffix }}
          version: ${{ steps.version.outputs.version }}

      - name: Build and push image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platforms }}
          push: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=min
          build-args: ${{ matrix.build_args }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.version.outputs.created }}

  move_channels:
    name: Move latest and X.Y channels
    # Runs only when every image of the release published, so a partial release
    # never moves the channels.
    needs: [push_to_registry, push_playwright_images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    # Serialized across runs: the newest release always wins, however long its
    # images took to build. Re-resolving the tags below makes a late run of an
    # older release a no-op instead of a rollback.
    concurrency:
      group: release-publish-channels
      cancel-in-progress: false
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release
        id: version
        uses: ./.github/actions/resolve-release

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Alias channels
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MAJOR_MINOR: ${{ steps.version.outputs.major_minor }}
          LATEST: ${{ steps.version.outputs.latest }}
          MINOR: ${{ steps.version.outputs.minor }}
          DOCKERHUB_IMAGE: temeteke/pyscraper
          GHCR_IMAGE: ghcr.io/${{ github.repository }}
        run: |
          set -euo pipefail

          # Registry reads can lag behind writes; retry before failing.
          digest() {
            local ref="$1" out=""
            local _
            for _ in 1 2 3 4 5 6; do
              if out="$(docker buildx imagetools inspect \
                --format '{{.Manifest.Digest}}' "$ref" 2>/dev/null)"; then
                printf '%s' "$out"
                return 0
              fi
              sleep 5
            done
            echo "::error::cannot inspect ${ref}" >&2
            return 1
          }

          channels=()
          if [ "${MINOR}" = "true" ]; then channels+=("${MAJOR_MINOR}"); fi
          if [ "${LATEST}" = "true" ]; then channels+=("latest"); fi
          if [ "${#channels[@]}" -eq 0 ]; then
            echo "::notice::No channel moves for ${VERSION} (a newer release already exists)."
            exit 0
          fi

          # Naming convention: every image is `temeteke/pyscraper<suffix>` on
          # Docker Hub and `ghcr.io/<repo><suffix>` on GHCR. Keep this list in
          # sync with the build matrix: an image missing here keeps its old
          # latest / X.Y alias.
          suffixes=(
            ""
            "-standalone"
            "-playwright-chromium"
            "-playwright-firefox"
            "-playwright-webkit"
            "-playwright-hub"
            "-playwright-session-manager"
            "-selenium-session-manager"
            "-console"
          )

          # Preflight: resolve every source digest before writing anything, so
          # a missing or unreadable image leaves all channels untouched.
          declare -A source_digest=()
          for suffix in "${suffixes[@]}"; do
            for image in "${DOCKERHUB_IMAGE}${suffix}" "${GHCR_IMAGE}${suffix}"; do
              src="${image}:${VERSION}"
              source_digest["$src"]="$(digest "$src")"
            done
          done

          for suffix in "${suffixes[@]}"; do
            for image in "${DOCKERHUB_IMAGE}${suffix}" "${GHCR_IMAGE}${suffix}"; do
              src="${image}:${VERSION}"
              src_digest="${source_digest[$src]}"
              for channel in "${channels[@]}"; do
                dst="${image}:${channel}"
                # --prefer-index=false keeps a carbon copy of the source
                # manifest, so the digest comparison below is meaningful even
                # when the source is a single-platform manifest.
                docker buildx imagetools create --prefer-index=false \
                  -t "$dst" "$src" >/dev/null
                dst_digest="$(digest "$dst")"
                if [ "${src_digest}" != "${dst_digest}" ]; then
                  echo "::error::${dst} resolves to ${dst_digest}, expected ${src_digest}"
                  exit 1
                fi
                echo "moved ${dst} -> ${VERSION}"
              done
            done
          done

  publish_charts:
    name: Publish Helm chart to GHCR
    # Charts are part of the same release: publish them only after every image
    # and the latest / X.Y aliases succeeded.
    needs: [push_to_registry, push_playwright_images, move_channels]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve release
        id: version
        uses: ./.github/actions/resolve-release

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.2

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        run: echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Publish pyscraper chart
        env:
          REPOSITORY: oci://ghcr.io/temeteke/charts
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if helm show chart "$REPOSITORY/pyscraper" --version "$VERSION" >/dev/null 2>&1; then
            echo "pyscraper ${VERSION} is already published; skipping"
            exit 0
          fi
          helm lint charts/pyscraper
          rm -rf dist
          helm package charts/pyscraper -d dist \
            --version "$VERSION" --app-version "$VERSION"
          helm push "dist/pyscraper-${VERSION}.tgz" "$REPOSITORY"
